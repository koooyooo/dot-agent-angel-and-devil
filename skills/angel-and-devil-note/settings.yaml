# Settings for angel-and-devil-note.
# Do not put API keys here — use the GEMINI_API_KEY environment variable.
#
# Precedence: CLI flags > environment variables > this file > built-in defaults.

# Default language for the banter when the request does not name one.
#   auto = match the language the user is writing in
#   or a language code such as ja / en
# An explicit request ("in English", "日本語で") always wins.
language: auto

model: gemini-3.8-flash-tts

speed:
  # Playback rate via ffmpeg atempo (1.0 = no change).
  ja: 1.2
  en: 1.1

# See references/Voices.md for the full prebuilt list.
voices:
  angel: Leda
  devil: Puck

styles:
  angel: warm, bright, polite, and encouraging
  devil: rough, streetwise, teasing, and mischievously cynical
